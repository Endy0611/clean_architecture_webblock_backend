plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.webblock'
version = '0.0.1-SNAPSHOT'
description = 'api-gateway'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    // Spring Cloud 2025.1.x is the release train for Spring Boot 4.0.x - 4.1.x
    set('springCloudVersion', "2025.1.3")
    // Not managed by the Spring Boot BOM: springdoc 3.x targets Boot 4.x
    set('springdocVersion', "3.1.1")
}

dependencies {
    // Reactive (WebFlux) gateway - do NOT add spring-boot-starter-webmvc to this module
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // One Swagger UI for all services (WebFlux flavour, because the gateway is reactive)
    implementation "org.springdoc:springdoc-openapi-starter-webflux-ui:${springdocVersion}"
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
