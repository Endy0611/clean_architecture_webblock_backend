# Local Keycloak (login server) + its own PostgreSQL. Local dev only; on Kubernetes Keycloak is deployed separately.
#
# Start:  cd user-service && docker compose up -d
# Stop:   docker compose down        (add -v only if you want to delete the Keycloak data)
# Admin console: http://localhost:8180  (sign in with KEYCLOAK_ADMIN / KEYCLOAK_ADMIN_PASSWORD)
#
# No secrets live in this file. Compose reads them from user-service/.env (git-ignored). Create it yourself:
#   KEYCLOAK_ADMIN=<admin user for the Keycloak console>
#   KEYCLOAK_ADMIN_PASSWORD=<password for that admin>
#   KEYCLOAK_DB_USER=<postgres user for Keycloak>
#   KEYCLOAK_DB_PASSWORD=<postgres password for Keycloak>
# Optional: KEYCLOAK_PORT (default 8180), KEYCLOAK_DB_NAME (default keycloak)
#
# Then in Keycloak create realm "webblock" with the realm roles "user" and "admin" (see the steps in the chat),
# and give every service: KEYCLOAK_ISSUER_URI=http://localhost:8180/realms/webblock
name: webblock-keycloak

services:
  keycloak-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:?Set KEYCLOAK_DB_USER in user-service/.env}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in user-service/.env}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # No published port: only Keycloak talks to this database

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.0
    restart: unless-stopped
    # start-dev = HTTP on, no hostname checks. Fine for a laptop, never for uat/prod.
    command: ["start-dev"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:?Set KEYCLOAK_DB_USER in user-service/.env}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in user-service/.env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?Set KEYCLOAK_ADMIN in user-service/.env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in user-service/.env}
      # Health endpoints are served on the management port 9000 inside the container
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      # The image has no curl, so open the port with bash and read the ready answer
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

volumes:
  keycloak-db-data:
