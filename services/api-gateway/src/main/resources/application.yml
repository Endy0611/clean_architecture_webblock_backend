# LOCAL / DEV ONLY. On Kubernetes this module is not deployed: Istio does the routing.
# Keep these path prefixes identical to the Istio VirtualService so clients see no difference.
# Convention: /api/<folder name without "-service">/v1/**
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          # lb://<service-name> is resolved through Eureka (client-side load balancing)
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/user/v1/**
            - id: project-service
              uri: lb://project-service
              predicates:
                - Path=/api/project/v1/**
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/payment/v1/**
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/notification/v1/**
            - id: provisioning-service
              uri: lb://provisioning-service
              predicates:
                - Path=/api/provisioning/v1/**
            - id: ai-generator-service
              uri: lb://ai-generator-service
              predicates:
                - Path=/api/ai-generator/v1/**
            # OpenAPI specs for the gateway Swagger UI: /<service>/v3/api-docs -> <service>/v3/api-docs
            - id: user-service-api-docs
              uri: lb://user-service
              predicates:
                - Path=/user-service/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
            - id: project-service-api-docs
              uri: lb://project-service
              predicates:
                - Path=/project-service/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
            - id: payment-service-api-docs
              uri: lb://payment-service
              predicates:
                - Path=/payment-service/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
            - id: notification-service-api-docs
              uri: lb://notification-service
              predicates:
                - Path=/notification-service/v3/api-docs
              filters:
                - SetPath=/v3/api-docs

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

# One Swagger UI for every service: http://localhost:8080/swagger-ui.html (pick the service top-right)
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls-primary-name: user-service
    urls:
      - name: user-service
        url: /user-service/v3/api-docs
      - name: project-service
        url: /project-service/v3/api-docs
      - name: payment-service
        url: /payment-service/v3/api-docs
      - name: notification-service
        url: /notification-service/v3/api-docs
